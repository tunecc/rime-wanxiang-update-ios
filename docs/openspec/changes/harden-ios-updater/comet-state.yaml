      - choice: approved
        proposal:
          input:
            change: harden-ios-updater
            changeDir: docs/openspec/changes/harden-ios-updater
          outputs:
            full.design.handoff:
              handoffContext: docs/openspec/changes/harden-ios-updater/.comet/handoff/design-context.json
              handoffHash: 427198dfab2cdcde3ba10227dc3fcdb642bc98385a77dc216cdd214980238c29
              proposal: >-
                技术方案：

                1. 排除规则按模式是否含 / 区分：无 / 只匹配部署根目录，含 / 匹配完整相对路径；写入 custom/ 模板并保护根目录
                *.custom.yaml。

                2. Release 按标题（万象拼音输入方案、词库/实时全量预览）+ tag 正则选择；移除 sort
                -V，改为逐段数值比较；标题未命中时按 tag 回退并告警。

                3. HTTP 使用 curl -fSL --retry / wget 重试；失败删除残包；应用前做大小 + sha256
                校验；无哈希工具时告警降级，不判失败。

                4. 方案新增
                custom/.scheme_sha256：同版本哈希不同则更新、记录缺失则更新一次、本地版本更高不降级、全部一致则跳过。

                5. 通用解压根：解压目录只有一个顶层目录时剥离，方案与词库共用。

                6. 词库先校验后解压覆盖；dicts/ 缺失或为空强制更新。

                7. 模型下载前比对本地文件哈希；下载到部署目录内临时文件，校验后 mv 原子替换。

                8. 参数解析前移：--help/--doctor 不依赖 jq；带值参数检查缺值；--depdir 按路径含
                RimeUserData 推断元书，否则仓。

                9. CNB page_size=100、GitHub per_page=100，方案/词库共享 GitHub releases
                缓存；移除 TOOLS_API。

                10. 保持 bash 3.2/BSD 兼容，不新增依赖；方案更新成功后清理 build/；保留旧方案文件和用户数据。


                关键取舍与风险：首次升级因哈希记录缺失会执行一次方案更新；无哈希工具时仅大小校验；CNB 分页参数或上游标题变化均有回退与告警。


                测试策略：bash -n 与 bash 3.2 兼容检查；fixture 验证 release 选择、版本比较、哈希判定；真实
                zip 验证排除语义、解压根、build/ 清理与用户文件保留；故障注入 404/截断/坏哈希；CNB 与 GitHub
                各一次端到端实测，模型验证已最新则跳过。


                Spec Patch：无。
