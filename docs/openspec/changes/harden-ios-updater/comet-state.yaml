                    handoffHash: 427198dfab2cdcde3ba10227dc3fcdb642bc98385a77dc216cdd214980238c29
                    proposal: |-
                      技术方案：
                      1. 排除规则按模式是否含 / 区分：无 / 只匹配部署根目录，含 / 匹配完整相对路径；写入 custom/ 模板并保护根目录 *.custom.yaml。
                      2. Release 按标题（万象拼音输入方案、词库/实时全量预览）+ tag 正则选择；移除 sort -V，改为逐段数值比较；标题未命中时按 tag 回退并告警。
                      3. HTTP 使用 curl -fSL --retry / wget 重试；失败删除残包；应用前做大小 + sha256 校验；无哈希工具时告警降级，不判失败。
                      4. 方案新增 custom/.scheme_sha256：同版本哈希不同则更新、记录缺失则更新一次、本地版本更高不降级、全部一致则跳过。
